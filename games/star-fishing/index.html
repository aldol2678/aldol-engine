<script type="module">
import * as THREE from "three";
import { Rng } from "../../src/core/rng.js";
import { validateWorldManifest, worldToSim } from "../../src/core/worldforge.js";
import { createInitialState, step, SEED, TICK } from "./fishing.js";
import { createSim } from "../../src/render/sim-loader.js";
import { createAssetLoader } from "../../src/render/asset-loader.js";
import { createAudioManager } from "../../src/render/audio.js";
import {
  installHudCss, createHudPanel, createBark, createPrompt, createHelp,
  createRoundButton, bindMute, renderQuests, setSaveText, setPosText,
} from "../../src/render/hud.js";

const SAVE_KEY = "aldol-engine.star-fishing-m2.save.v1";

const worldRes = await fetch("./world.json");
const manifest = await worldRes.json();
const validation = validateWorldManifest(manifest);
if (!validation.valid) throw new Error("invalid manifest: " + JSON.stringify(validation.errors));
const world = worldToSim(manifest);

// GLB assets (renderer-side only; a failed load falls back to primitives).
const assetLoader = createAssetLoader({ baseUrl: "./" });
const assets = await assetLoader.loadAll(manifest);
const assetStatus = { loaded: [...assets.loaded.keys()], failed: assets.failed };

// Audio: procedural WebAudio voices (no audio files). BGM starts on the first gesture.
const audio = createAudioManager();
audio.setMuted(localStorage.getItem("aldol-engine.audio.muted") === "1");
window.addEventListener("pointerdown", () => audio.startBgm(), { once: true });
window.addEventListener("keydown", () => audio.startBgm(), { once: true });

// --- sim: WASM with JS fallback (src/render/sim-loader.js) ---
const sim = await createSim({
  kind: "fishing",
  seed: SEED,
  rngSeed: SEED,
  world,
  js: { createInitialState, step },
});
let state = sim.state;

// --- HUD (shared kit: src/render/hud.js) ---
installHudCss("lake");
const panel = createHudPanel({
  id: "hud",
  title: "별낚시 M2 — 호수 낚시",
  rows: [
    { id: "zone", tag: "div" },
    { id: "score", tag: "div" },
    { id: "quests", tag: "div", collapsible: true },
    { id: "npcs", tag: "div", collapsible: true },
    { id: "pos", tag: "div", collapsible: true },
    { id: "save-state", tag: "div", collapsible: true },
  ],
});
const phasePanel = createHudPanel({
  id: "phase",
  position: "right",
  style: { color: "#ffe9a8", padding: "10px 14px", fontSize: "15px" },
});
const bark = createBark();
const prompt = createPrompt("E — 낚시꾼과 대화하기");
createHelp("WASD/방향키 이동 · E 던지기/대화 · 스페이스바 챔질 · 드래그 이동(터치)", "center");

// --- Save / load. ---
function saveGame(note) {
  localStorage.setItem(SAVE_KEY, JSON.stringify({
    player: state.player,
    score: state.score,
    casts: state.casts,
    caught: state.caught,
    quests: state.quests.map((q) => ({ id: q.id, done: q.done, progress: q.progress })),
    tick: state.tick, savedAt: Date.now(),
  }));
  setSaveText(panel.slots["save-state"], note);
}
function loadGame() {
  let saved;
  try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch { saved = null; }
  if (!saved) return;
  if (saved.player) { state.player.x = saved.player.x; state.player.y = saved.player.y; }
  if (typeof saved.score === "number") state.score = saved.score;
  if (typeof saved.casts === "number") state.casts = saved.casts;
  if (Array.isArray(saved.caught)) {
    state.caught = saved.caught;
    for (const c of saved.caught) {
      const f = state.fish.find((x) => x.id === c.fishId);
      if (f) { f.state = "caught"; f.caughtUntil = state.tick + 600; }
    }
  }
  if (Array.isArray(saved.quests)) {
    for (const sq of saved.quests) {
      const q = state.quests.find((x) => x.id === sq.id);
      if (q) { q.done = !!sq.done; q.progress = sq.progress ?? 0; }
    }
  }
  setSaveText(panel.slots["save-state"], "불러옴");
}
loadGame();
// Push a restored save into the sim (no-op round-trip when there is no save).
sim.loadState(state);
state = sim.state;

// --- Three.js scene (polish pass: shadows, sky, animated water, built-up models). ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.getElementById("app").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcfe9f5, 30, 90);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(2, 11, 13);
camera.lookAt(2, 0, -1);

// Gradient sky dome (top blue -> horizon pale) + sun disc.
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(80, 16, 12),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    fog: false,
    vertexShader: `varying vec3 vPos; void main() { vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `varying vec3 vPos; void main() { float h = normalize(vPos).y; vec3 top = vec3(0.18, 0.45, 0.85); vec3 bot = vec3(0.62, 0.80, 0.95); gl_FragColor = vec4(mix(bot, top, smoothstep(-0.35, 0.05, h)), 1.0); }`,
  })
);
scene.add(sky);

scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x4a6b3a, 0.6));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.6);
sun.position.set(10, 18, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -14;
sun.shadow.camera.right = 14;
sun.shadow.camera.top = 14;
sun.shadow.camera.bottom = -14;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 50;
sun.shadow.bias = -0.0005;
sun.target.position.set(2, 0, -2);
scene.add(sun, sun.target);

// Shore (green) — receives shadows.
const shore = new THREE.Mesh(
  new THREE.PlaneGeometry(16, 8),
  new THREE.MeshStandardMaterial({ color: 0x5da24a, roughness: 1 })
);
shore.rotation.x = -Math.PI / 2;
shore.position.set(2, 0, 4);
shore.receiveShadow = true;
scene.add(shore);

// Lake — segmented plane, vertices animated into gentle waves.
const lakeGeo = new THREE.PlaneGeometry(16, 8, 32, 16);
const lakeBase = lakeGeo.attributes.position.array.slice();
const lake = new THREE.Mesh(
  lakeGeo,
  new THREE.MeshStandardMaterial({ color: 0x2e86c1, transparent: true, opacity: 0.68, roughness: 0.25, metalness: 0.1 })
);
lake.rotation.x = -Math.PI / 2;
lake.position.set(2, 0.05, -4);
lake.receiveShadow = true;
scene.add(lake);

// Dock: individual planks + posts.
const plankMat = new THREE.MeshStandardMaterial({ color: 0x9a7a45, roughness: 0.9 });
for (let i = 0; i < 7; i++) {
  const plank = new THREE.Mesh(new THREE.BoxGeometry(2, 0.18, 0.72), plankMat);
  plank.position.set(0, 0.15, 0.35 - i * 0.78);
  plank.castShadow = true;
  plank.receiveShadow = true;
  scene.add(plank);
}
const postMat = new THREE.MeshStandardMaterial({ color: 0x6b4e26, roughness: 0.9 });
for (const [px, pz] of [[-0.9, -4.8], [0.9, -4.8], [-0.9, -0.2], [0.9, -0.2]]) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.9, 8), postMat);
  post.position.set(px, 0.45, pz);
  post.castShadow = true;
  scene.add(post);
}

// Reeds: clusters of 3 cones each, varying heights.
const reedMat = new THREE.MeshStandardMaterial({ color: 0x3f7a2e, roughness: 1 });
for (const r of world.reeds || []) {
  for (let k = 0; k < 3; k++) {
    const h = 1.2 + k * 0.35;
    const reed = new THREE.Mesh(new THREE.ConeGeometry(0.22, h, 6), reedMat);
    reed.position.set(r.x + (k - 1) * 0.28, h / 2, r.y + (k % 2) * 0.2 - 0.1);
    reed.castShadow = true;
    scene.add(reed);
  }
}

// Shore detail: grass tufts + pebbles along the water edge + lily pads.
const grassMat = new THREE.MeshStandardMaterial({ color: 0x4a8a38, roughness: 1 });
for (const [gx, gy] of [[-5, 2], [-3, 3.5], [-1, 2.5], [1, 4], [3, 3], [-4, 6], [5, 6], [7, 3], [8, 5], [-5.5, 7], [0, 6.5], [6, 1.5]]) {
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.55, 5), grassMat);
  tuft.position.set(gx, 0.28, gy);
  tuft.castShadow = true;
  scene.add(tuft);
}
const pebbleMat = new THREE.MeshStandardMaterial({ color: 0x9aa0a3, roughness: 1 });
for (const [px, py] of [[-5, 0.4], [-2.5, 0.3], [1.5, 0.5], [4, 0.3], [6.5, 0.45], [8, 0.35], [-4, 0.55], [2.5, 0.25]]) {
  const pebble = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), pebbleMat);
  pebble.scale.y = 0.6;
  pebble.position.set(px, 0.08, py);
  pebble.castShadow = true;
  scene.add(pebble);
}
const padMat = new THREE.MeshStandardMaterial({ color: 0x2f7d32, roughness: 0.8 });
for (const [lx, ly] of [[-3, -3], [2, -6.5], [5, -2.5], [-5, -6]]) {
  const pad = new THREE.Mesh(new THREE.CircleGeometry(0.55, 16), padMat);
  pad.rotation.x = -Math.PI / 2;
  pad.position.set(lx, 0.09, ly);
  scene.add(pad);
}

// Drifting clouds — kept low on the horizon band, where this camera can see them.
const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, fog: false });
const clouds = [];
for (const [cx, cy, cz] of [[-10, 3, -30], [6, 4, -35], [16, 2, -28], [-20, 3, -25]]) {
  const g = new THREE.Group();
  for (const [ox, s] of [[-1.8, 1.6], [0, 2.2], [1.9, 1.5]]) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(s, 10, 8), cloudMat);
    puff.scale.y = 0.5;
    puff.position.set(ox, 0, 0);
    g.add(puff);
  }
  g.position.set(cx, cy, cz);
  scene.add(g);
  clouds.push(g);
}

// Angler NPC: body + head + straw hat + leaning rod.
const anglerMeshes = new Map();
for (const n of state.npcs) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.8, 4, 10), new THREE.MeshStandardMaterial({ color: 0xe67e22 }));
  body.position.y = 0.8;
  body.castShadow = true;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), new THREE.MeshStandardMaterial({ color: 0xf5c99b }));
  head.position.y = 1.7;
  head.castShadow = true;
  const hatTop = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.35, 12), new THREE.MeshStandardMaterial({ color: 0xd9b36c }));
  hatTop.position.y = 2.0;
  hatTop.castShadow = true;
  const hatBrim = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.05, 16), new THREE.MeshStandardMaterial({ color: 0xd9b36c }));
  hatBrim.position.y = 1.88;
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.045, 2.4, 6), new THREE.MeshStandardMaterial({ color: 0x7a5230 }));
  rod.position.set(0.35, 1.4, -0.6);
  rod.rotation.x = -0.9;
  g.add(body, head, hatTop, hatBrim, rod);
  g.position.set(n.x, 0, n.y);
  scene.add(g);
  anglerMeshes.set(n.id, g);
}

// Fish: built-up group (body + tail + dorsal fin + eyes), colored + sized by species.
const FISH_STYLE = {
  small: { color: 0x7fb3d5, scale: 0.7 },
  medium: { color: 0x2e86c1, scale: 1.0 },
  big: { color: 0xffd700, scale: 1.5 },
};
const fishMeshes = new Map();
for (const f of state.fish) {
  // A fish whose manifest asset is a loaded GLB uses the real model.
  const npc = world.npcs.find((n) => n.id === f.id);
  const glb = npc?.assetId ? assetLoader.instance(assets.loaded, npc.assetId) : null;
  if (glb) {
    glb.position.set(f.x, -0.15, f.y);
    scene.add(glb);
    fishMeshes.set(f.id, glb);
    continue;
  }
  const style = FISH_STYLE[f.species] || FISH_STYLE.small;
  const s = style.scale;
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.32 * s, 12, 10),
    new THREE.MeshStandardMaterial({ color: style.color, roughness: 0.4 })
  );
  body.scale.set(1.5, 0.6, 0.7);
  const tail = new THREE.Mesh(
    new THREE.ConeGeometry(0.22 * s, 0.5 * s, 8),
    new THREE.MeshStandardMaterial({ color: style.color, roughness: 0.4 })
  );
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-0.6 * s, 0, 0);
  const fin = new THREE.Mesh(
    new THREE.ConeGeometry(0.14 * s, 0.3 * s, 6),
    new THREE.MeshStandardMaterial({ color: style.color, roughness: 0.4 })
  );
  fin.position.set(0, 0.22 * s, 0);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  for (const ez of [-0.14 * s, 0.14 * s]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.05 * s, 6, 6), eyeMat);
    eye.position.set(0.32 * s, 0.08 * s, ez);
    g.add(eye);
  }
  g.add(body, tail, fin);
  g.position.set(f.x, -0.15, f.y);
  scene.add(g);
  fishMeshes.set(f.id, g);
}

// Star trophy above the dock end (GLB; gold octahedron if the load failed).
const trophyMeshes = [];
for (const t of world.trophies || []) {
  let mesh = t.assetId ? assetLoader.instance(assets.loaded, t.assetId) : null;
  if (!mesh) {
    mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.5),
      new THREE.MeshStandardMaterial({ color: 0xffd700, roughness: 0.3, metalness: 0.6 })
    );
  }
  mesh.position.set(t.x, t.height, t.y);
  mesh.userData.baseY = t.height;
  scene.add(mesh);
  trophyMeshes.push(mesh);
}

// Bobber: red top + white bottom.
const bobberGroup = new THREE.Group();
const bobTop = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), new THREE.MeshStandardMaterial({ color: 0xe74c3c }));
const bobBottom = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffffff }));
bobBottom.position.y = -0.22;
bobberGroup.add(bobTop, bobBottom);
bobberGroup.visible = false;
scene.add(bobberGroup);

// Ripple rings at the bobber.
const rippleMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 });
const ripples = [];
for (let i = 0; i < 2; i++) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.42, 32), rippleMat.clone());
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.12;
  ring.visible = false;
  scene.add(ring);
  ripples.push(ring);
}

// Player rod (aims at the bobber while fishing) + line.
const playerRod = new THREE.Mesh(
  new THREE.CylinderGeometry(0.035, 0.05, 2.2, 6),
  new THREE.MeshStandardMaterial({ color: 0x7a5230 })
);
playerRod.visible = false;
scene.add(playerRod);
const lineGeo = new THREE.BufferGeometry();
lineGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
const line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 }));
line.visible = false;
scene.add(line);

// Catch sparkles: 48 gold points, burst on catch.
const SPARK_N = 48;
const sparkPos = new Float32Array(SPARK_N * 3);
const sparkVel = new Float32Array(SPARK_N * 3);
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute("position", new THREE.BufferAttribute(sparkPos, 3));
const sparkMat = new THREE.PointsMaterial({ color: 0xffd700, size: 0.25, transparent: true, opacity: 0 });
const sparks = new THREE.Points(sparkGeo, sparkMat);
sparks.visible = false;
scene.add(sparks);
let sparkLife = 0;
const visualRng = new Rng(SEED + ":visual");
function burstSparkles(x, y, z) {
  for (let i = 0; i < SPARK_N; i++) {
    sparkPos[i * 3] = x;
    sparkPos[i * 3 + 1] = y;
    sparkPos[i * 3 + 2] = z;
    const a = visualRng.next() * Math.PI * 2;
    const up = 1.5 + visualRng.next() * 2;
    const out = 0.5 + visualRng.next() * 1.5;
    sparkVel[i * 3] = Math.cos(a) * out;
    sparkVel[i * 3 + 1] = up;
    sparkVel[i * 3 + 2] = Math.sin(a) * out;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkLife = 1;
  sparks.visible = true;
}

// Player (blue capsule + cap).
const playerGroup = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.8, 4, 10), new THREE.MeshStandardMaterial({ color: 0x3498db }));
pBody.position.y = 0.8;
pBody.castShadow = true;
const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 10), new THREE.MeshStandardMaterial({ color: 0xf5c99b }));
pHead.position.y = 1.7;
pHead.castShadow = true;
const pCap = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x2c3e50 }));
pCap.position.y = 1.78;
playerGroup.add(pBody, pHead, pCap);
scene.add(playerGroup);

// --- Input. ---
const keys = new Set();
let castPressed = false;
let reelPressed = false;
let drag = null;
window.addEventListener("keydown", (e) => {
  if (e.key === " ") { reelPressed = true; e.preventDefault(); }
  if (e.key === "e" || e.key === "E") castPressed = true;
  keys.add(e.key.toLowerCase());
});
window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
createRoundButton({ id: "cast-btn", label: "🎣 던지기", size: 72, right: 96, bottom: 64, background: "rgba(30, 90, 140, 0.85)", onPress: () => { castPressed = true; } });
createRoundButton({ id: "reel-btn", label: "🌀 챔질", size: 72, right: 12, bottom: 64, background: "rgba(180, 60, 40, 0.9)", onPress: () => { reelPressed = true; } });
const muteBtn = createRoundButton({ id: "mute-btn", label: "🔊", size: 72, right: 180, bottom: 64, background: "rgba(30, 90, 140, 0.85)" });
bindMute(audio, muteBtn);
renderer.domElement.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0 }; });
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!drag) return;
  drag.dx = e.clientX - drag.x;
  drag.dy = e.clientY - drag.y;
});
renderer.domElement.addEventListener("pointerup", () => { drag = null; });

function readInput() {
  let dx = 0, dy = 0;
  if (keys.has("a") || keys.has("arrowleft")) dx -= 1;
  if (keys.has("d") || keys.has("arrowright")) dx += 1;
  // Camera sits at +z looking -z, so up-screen is -y: W = dy -1, S = dy +1.
  // (The old sign was backwards — W moved the player down-screen. Fixed 2026-11-21.)
  if (keys.has("w") || keys.has("arrowup")) dy -= 1;
  if (keys.has("s") || keys.has("arrowdown")) dy += 1;
  if (drag && Math.hypot(drag.dx, drag.dy) > 12) {
    dx += drag.dx / 60;
    dy += drag.dy / 60;
  }
  const input = { dx, dy };
  if (castPressed) { input.cast = true; castPressed = false; }
  if (reelPressed) { input.reel = true; reelPressed = false; }
  // E near the angler means talk, not cast.
  const angler = state.npcs.find((n) => n.id === "angler-1");
  if (input.cast && angler && Math.hypot(state.player.x - angler.x, state.player.y - angler.y) < 1.5) {
    input.interact = true;
    delete input.cast;
    audio.play("talk");
  }
  return input;
}

// --- HUD. ---
const zoneEl = panel.slots["zone"];
const scoreEl = panel.slots["score"];
const questsEl = panel.slots["quests"];
const npcsEl = panel.slots["npcs"];
const posEl = panel.slots["pos"];
const phaseEl = phasePanel.el;
const barkRng = new Rng(SEED + ":bark");
const BARKS = {
  catch: ["별고기를 낚았어!", "잡았다! 반짝이는 별고기야!", "낚시 대성공!"],
  scare: ["너무 빨랐어, 물고기가 도망갔어!", "아쉽다, 조금만 더 기다릴 걸!"],
  quest: ["의뢰 완료!", "잘했어!"],
};

function refreshHud() {
  zoneEl.textContent = `구역: ${state.player.y < 0 ? (Math.abs(state.player.x) <= 1 ? "선착장" : "호수") : "호숫가"}`;
  scoreEl.textContent = `점수: ${state.score} · 낚은 고기: ${state.caught.length}마리 · 던진 횟수: ${state.casts}`;
  renderQuests(questsEl, state.quests, (q) => q.type === "quest.catch" ? ` (${q.progress}/3)` : "");
  npcsEl.textContent = "물고기: " + state.fish.map((f) => `${f.id}:${f.state === "caught" ? "낚임" : f.state === "chase" ? "미끼로" : f.state === "flee" ? "도망" : "헤엄"}`).join(" · ");
  setPosText(posEl, state.player.x, state.player.y);
  const fs = state.fishing;
  phaseEl.textContent =
    fs.phase === "waiting" ? "기다리는 중… 물고기가 올 때까지 기다리세요." :
    fs.phase === "bite" ? "물었다! 지금 스페이스바(챔질)!" :
    fs.phase === "cooldown" ? "물고기를 놀라게 했어. 잠시 뒤 다시 던지세요." :
    "선착장 끝으로 가서 E를 눌러 찌를 던지세요.";
  const angler = state.npcs.find((n) => n.id === "angler-1");
  const talkQuest = state.quests.find((q) => q.type === "quest.talk");
  const near = angler && Math.hypot(state.player.x - angler.x, state.player.y - angler.y) < 1.5;
  prompt.setVisible(talkQuest && !talkQuest.done && near);
}

// --- Main loop (fixed step 1/60). ---
let last = performance.now();
let acc = 0;
let lastSave = 0;
const wasDone = new Map(state.quests.map((q) => [q.id, q.done]));
let prevCaught = state.caught.length;
let prevPhase = state.fishing.phase;
let lastBobber = null;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  acc += dt;
  let stepped = false;
  while (acc >= TICK) {
    acc -= TICK;
    state = sim.step(readInput());
    stepped = true;
  }
  if (stepped) {
    for (const q of state.quests) {
      if (q.done && !wasDone.get(q.id)) {
        wasDone.set(q.id, true);
        audio.play("quest");
        bark.show(barkRng.pick(BARKS.quest));
        saveGame("의뢰 완료, 저장됨");
      }
    }
    if (state.caught.length > prevCaught) {
      prevCaught = state.caught.length;
      audio.play("catch");
      bark.show(barkRng.pick(BARKS.catch));
      if (lastBobber) burstSparkles(lastBobber.x, 0.6, lastBobber.y);
      saveGame("고기 낚음, 저장됨");
    }
    if (prevPhase === "idle" && state.fishing.phase === "waiting") audio.play("cast");
    if (prevPhase !== "bite" && state.fishing.phase === "bite") audio.play("bite");
    if (prevPhase === "waiting" && state.fishing.phase === "cooldown") bark.show(barkRng.pick(BARKS.scare));
    prevPhase = state.fishing.phase;
    if (now - lastSave > 5000) { saveGame(); lastSave = now; }
    refreshHud();
  }
  bark.tick(dt);

  const t = now / 1000;

  // Water waves (visual only — the sim is untouched).
  const pos = lakeGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const bx = lakeBase[i * 3];
    const by = lakeBase[i * 3 + 1];
    pos.setZ(i, Math.sin(bx * 0.9 + t * 1.2) * 0.05 + Math.cos(by * 0.8 + t * 0.9) * 0.05);
  }
  pos.needsUpdate = true;
  lakeGeo.computeVertexNormals();

  // Clouds drift.
  for (const c of clouds) {
    c.position.x += dt * 0.3;
    if (c.position.x > 20) c.position.x = -20;
  }

  // Render.
  playerGroup.position.set(state.player.x, 0, state.player.y);
  for (const n of state.npcs) {
    const m = anglerMeshes.get(n.id);
    if (m) m.position.set(n.x, 0, n.y);
  }
  state.fish.forEach((f, i) => {
    const m = fishMeshes.get(f.id);
    if (!m) return;
    m.visible = f.state !== "caught";
    if (m.visible) {
      m.position.set(f.x, -0.15 + Math.sin(now / 400 + i * 2) * 0.04, f.y);
      m.rotation.y = Math.sin(now / 500 + i * 1.3) * 0.3;
    }
  });
  for (const m of trophyMeshes) {
    m.rotation.y += dt * 0.8;
    m.position.y = m.userData.baseY + Math.sin(now / 500) * 0.15;
  }
  const fs = state.fishing;
  if (fs.bobber) {
    lastBobber = fs.bobber;
    bobberGroup.visible = true;
    const bob = fs.phase === "bite" ? Math.sin(now / 90) * 0.12 : Math.sin(now / 300) * 0.04;
    bobberGroup.position.set(fs.bobber.x, 0.35 + bob, fs.bobber.y);
    ripples.forEach((ring, i) => {
      const rt = ((t + i * 0.8) % 1.6) / 1.6;
      ring.visible = true;
      ring.position.set(fs.bobber.x, 0.12, fs.bobber.y);
      ring.scale.setScalar(0.5 + rt * 2.5);
      ring.material.opacity = 0.55 * (1 - rt);
    });
    playerRod.visible = true;
    playerRod.position.set(state.player.x, 1.3, state.player.y);
    playerRod.lookAt(fs.bobber.x, 0.5, fs.bobber.y);
    playerRod.rotateX(Math.PI / 2);
    line.visible = true;
    const lp = lineGeo.attributes.position;
    lp.setXYZ(0, state.player.x, 1.6, state.player.y);
    lp.setXYZ(1, fs.bobber.x, 0.5, fs.bobber.y);
    lp.needsUpdate = true;
  } else {
    bobberGroup.visible = false;
    ripples.forEach((ring) => { ring.visible = false; });
    playerRod.visible = false;
    line.visible = false;
  }
  if (sparkLife > 0) {
    sparkLife -= dt;
    for (let i = 0; i < SPARK_N; i++) {
      sparkPos[i * 3] += sparkVel[i * 3] * dt;
      sparkPos[i * 3 + 1] += sparkVel[i * 3 + 1] * dt;
      sparkPos[i * 3 + 2] += sparkVel[i * 3 + 2] * dt;
      sparkVel[i * 3 + 1] -= 2 * dt;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkMat.opacity = Math.max(0, sparkLife);
    if (sparkLife <= 0) sparks.visible = false;
  }
  camera.position.set(state.player.x + 2, 11, state.player.y + 11);
  camera.lookAt(state.player.x + 2, 0, state.player.y - 3);
  renderer.render(scene, camera);
}

window.__STAR_FISHING__ = {
  get state() { return state; },
  get hash() { return sim.hash(); },
  get backend() { return sim.backend; },
  world, saveKey: SAVE_KEY, assets: assetStatus,
  audio: { get muted() { return audio.muted; }, get played() { return audio.played; } },
};
refreshHud();
requestAnimationFrame(frame);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
