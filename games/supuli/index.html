<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>수풀리 M1 — 마을 + 숲 + 농장 | Aldol Engine</title>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.187.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as THREE from "three";
import { createAudioManager } from "../../src/render/audio.js";
import {
  installHudCss, createHudPanel, createBark, createPrompt, createHelp,
  createRoundButton, bindMute, renderQuests, setSaveText, setPosText,
} from "../../src/render/hud.js";
import { Rng } from "../../src/core/rng.js";
import { createInitialState, step, simulate, STEP } from "../../src/core/sim.js";
import { stateHash } from "../../src/core/state-hash.js";
import { validateWorldManifest, worldToSim } from "../../src/core/worldforge.js";

const SEED = "supuli-m1";
const SAVE_KEY = "aldol-engine.supuli-m1.save.v4";

// --- load the WorldForge manifest (single source of truth for the map) ---
const manifest = await fetch("./world.json").then((r) => r.json());
const validation = validateWorldManifest(manifest);
if (!validation.valid) {
  document.body.innerHTML = "<pre>world.json invalid: " + JSON.stringify(validation.errors, null, 2) + "</pre>";
  throw new Error("world manifest invalid");
}
const world = worldToSim(manifest);

// --- HUD (shared kit: src/render/hud.js) ---
installHudCss("forest");
const panel = createHudPanel({
  title: "수풀리 M1 — 마을 + 숲 + 농장",
  rows: [
    "zone",
    { tag: "div", className: "hpbar", html: '<div id="hpfill"></div>' },
    "hp",
    { id: "quests", tag: "div" },
    "npc-state",
    "pos",
    "save-state",
  ],
});
const bark = createBark();
const prompt = createPrompt("E: 대화하기");
createHelp("WASD/방향키 이동 · E 대화 · 스페이스바 공격 · 드래그 이동(터치)", "right");

const BARKS = {
  patrol: ["오늘 날씨 참 좋지.", "마을은 평화로워야 해.", "길을 잃었나? 마을은 작아."],
  chase: ["어? 누구야, 거기!", "잠깐, 너 누구야?", "이쪽으로 와 봐."],
  flee: ["살려줘! 도망가야 해!", "너무 무서워…", "저리 가!"],
  boar: ["꿀꿀!", "크르릉…", "꿀꿀꿀!"],
  guardian: ["크아아!", "숲을 더럽히지 마!", "돌아가라, 침입자야!"],
  hit: ["맞혔다!", "제대로 들어갔어!"],
  quest: ["고마워! 마을을 잘 부탁해.", "너라면 수풀을 지킬 수 있을 거야."],
};
const STATE_LABEL = { patrol: "순찰", chase: "추격", flee: "도망", defeated: "처치됨" };

// --- state (save is a snapshot, not a seed: it restores position + progress) ---
let state = createInitialState(SEED, world);
const saved = (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch { return null; } })();
if (saved && saved.player) {
  state.player.x = saved.player.x;
  state.player.y = saved.player.y;
  state.player.hp = saved.player.hp ?? world.combat.playerHp;
  if (Array.isArray(saved.quests)) {
    for (const sq of saved.quests) {
      const q = state.quests.find((x) => x.id === sq.id);
      if (q) { q.done = !!sq.done; q.progress = sq.progress || 0; }
    }
  }
  if (Array.isArray(saved.shards)) {
    for (const ss of saved.shards) {
      const s = state.shards.find((x) => x.id === ss.id);
      if (s) s.collected = !!ss.collected;
    }
  }
  if (Array.isArray(saved.crops)) {
    for (const sc of saved.crops) {
      const c = state.crops.find((x) => x.id === sc.id);
      if (c) c.collected = !!sc.collected;
    }
  }
  if (Array.isArray(saved.herbs)) {
    for (const sh of saved.herbs) {
      const h = state.herbs.find((x) => x.id === sh.id);
      if (h) h.consumed = !!sh.consumed;
    }
  }
  setSaveText(panel.slots["save-state"], "불러옴", "저장됨");
}
const barkRng = new Rng(SEED).fork("bark");

// --- three.js scene (built from the manifest) ---
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("app").appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc5e8);
scene.fog = new THREE.Fog(0x9fc5e8, 30, 70);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0x3a5f3a, 1.1));
const sun = new THREE.DirectionalLight(0xfff2cc, 1.4);
sun.position.set(8, 14, 6);
scene.add(sun);

const { bounds } = world;
const cx = (bounds.minX + bounds.maxX) / 2;
const cy = (bounds.minY + bounds.maxY) / 2;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(bounds.maxX - bounds.minX, bounds.maxY - bounds.minY),
  new THREE.MeshStandardMaterial({ color: 0x5da85d })
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(cx, 0, cy);
scene.add(ground);
// Forest floor (darker patch over the forest zone).
const forest = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 10),
  new THREE.MeshStandardMaterial({ color: 0x3d7a3d })
);
forest.rotation.x = -Math.PI / 2;
forest.position.set(13, 0.01, 3);
scene.add(forest);
// Deep forest floor (darkest patch).
const deepForest = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 10),
  new THREE.MeshStandardMaterial({ color: 0x2e5d2e })
);
deepForest.rotation.x = -Math.PI / 2;
deepForest.position.set(20, 0.01, 3);
scene.add(deepForest);
// Farm soil (brown patch over the farm zone).
const farm = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 6),
  new THREE.MeshStandardMaterial({ color: 0x8a6d3b })
);
farm.rotation.x = -Math.PI / 2;
farm.position.set(0, 0.01, -5);
scene.add(farm);

// Waypoint markers.
for (const wp of world.waypoints) {
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(0.28, 16),
    new THREE.MeshBasicMaterial({ color: 0xffe066 })
  );
  dot.rotation.x = -Math.PI / 2;
  dot.position.set(wp.x, 0.02, wp.y);
  scene.add(dot);
}

// Houses from the manifest.
for (const h of world.houses) {
  const house = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.6, 2), new THREE.MeshStandardMaterial({ color: 0xd8b58c }));
  body.position.y = 0.8;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(1.9, 1.1, 4), new THREE.MeshStandardMaterial({ color: 0xa34d2d }));
  roof.position.y = 2.15;
  roof.rotation.y = Math.PI / 4;
  house.add(body, roof);
  house.position.set(h.x, 0, h.y);
  scene.add(house);
}

// Trees from the manifest.
for (const t of world.trees) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.25, 1.2, 8), new THREE.MeshStandardMaterial({ color: 0x7a4a21 }));
  trunk.position.y = 0.6;
  const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.2, 8), new THREE.MeshStandardMaterial({ color: 0x2e6b2e }));
  leaves.position.y = 2.1;
  tree.add(trunk, leaves);
  tree.position.set(t.x, 0, t.y);
  scene.add(tree);
}

// Crops from the manifest (hidden once harvested).
const cropMeshes = new Map();
for (const c of world.crops) {
  const crop = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.7, 6), new THREE.MeshStandardMaterial({ color: 0x4e7a2e }));
  stem.position.y = 0.35;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 8), new THREE.MeshStandardMaterial({ color: 0xe8a33d }));
  head.position.y = 0.85;
  crop.add(stem, head);
  crop.position.set(c.x, 0, c.y);
  scene.add(crop);
  cropMeshes.set(c.id, crop);
}

// Healing herbs from the manifest (hidden once consumed).
const herbMeshes = new Map();
for (const h of world.herbs) {
  const herb = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.4),
    new THREE.MeshStandardMaterial({ color: 0x7fff7f, emissive: 0x228822, metalness: 0.2, roughness: 0.4 })
  );
  herb.position.set(h.x, 0.7, h.y);
  scene.add(herb);
  herbMeshes.set(h.id, herb);
}

// Scarecrows from the manifest.
for (const sc of world.scarecrows) {
  const scare = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.8, 6), new THREE.MeshStandardMaterial({ color: 0x6b4a2a }));
  pole.position.y = 0.9;
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 0.3), new THREE.MeshStandardMaterial({ color: 0xc9a86a }));
  body.position.y = 1.3;
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0x8d6e3f }));
  hat.position.y = 1.85;
  scare.add(pole, body, hat);
  scare.position.set(sc.x, 0, sc.y);
  scene.add(scare);
}
const shardMeshes = new Map();
for (const s of world.shards) {
  const shard = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.45),
    new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xaa8800, metalness: 0.6, roughness: 0.3 })
  );
  shard.position.set(s.x, 0.9, s.y);
  scene.add(shard);
  shardMeshes.set(s.id, shard);
}

function makePerson(color, scale = 1) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 0.7, 4, 8), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 0.75;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 12), new THREE.MeshStandardMaterial({ color: 0xf2c9a0 }));
  head.position.y = 1.55;
  g.add(body, head);
  g.scale.setScalar(scale);
  scene.add(g);
  return g;
}
const playerMesh = makePerson(0x2e7d32);
const npcMeshes = new Map();
const NPC_STYLE = {
  "villager-1": { color: 0xe67e22, scale: 1 },
  "boar-1": { color: 0x5d4037, scale: 1.15 },
  "elder-1": { color: 0x5b7fa6, scale: 1 },
  "guardian-1": { color: 0x6a1b9a, scale: 1.3 },
  "farmer-1": { color: 0xb5892d, scale: 1 },
};
for (const n of world.npcs) {
  const style = NPC_STYLE[n.id] || { color: 0xe67e22, scale: 1 };
  npcMeshes.set(n.id, makePerson(style.color, style.scale));
}

// --- input ---
const keys = {};
let interactPressed = false;
let attackPressed = false;
let touchVec = { x: 0, y: 0 };
addEventListener("keydown", (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "e") interactPressed = true;
  if (e.code === "Space") { attackPressed = true; e.preventDefault(); }
});

// Audio: procedural WebAudio voices (no audio files). BGM starts on the first gesture.
const audio = createAudioManager();
audio.setMuted(localStorage.getItem("aldol-engine.audio.muted") === "1");
window.addEventListener("pointerdown", () => audio.startBgm(), { once: true });
window.addEventListener("keydown", () => audio.startBgm(), { once: true });
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = false; });
let dragStart = null;
renderer.domElement.addEventListener("pointerdown", (e) => { dragStart = { x: e.clientX, y: e.clientY }; });
renderer.domElement.addEventListener("pointermove", (e) => {
  if (!dragStart) return;
  touchVec = { x: (e.clientX - dragStart.x) / 40, y: (e.clientY - dragStart.y) / 40 };
});
addEventListener("pointerup", () => { dragStart = null; touchVec = { x: 0, y: 0 }; });
createRoundButton({ id: "attack-btn", label: "⚔ 공격", size: 72, right: 16, bottom: 56, background: "rgba(180, 60, 60, 0.85)", onPress: () => { attackPressed = true; } });
const muteBtn = createRoundButton({ id: "mute-btn", label: "🔊", size: 44, fontSize: 20, right: 16, bottom: 140, background: "rgba(16, 26, 18, 0.85)" });
bindMute(audio, muteBtn);

function readInput() {
  // Screen mapping: camera sits at +z looking -z, so W (up-screen) = +y, S = -y.
  let dx = (keys["d"] || keys["arrowright"] ? 1 : 0) - (keys["a"] || keys["arrowleft"] ? 1 : 0);
  let dy = (keys["w"] || keys["arrowup"] ? 1 : 0) - (keys["s"] || keys["arrowdown"] ? 1 : 0);
  dx += touchVec.x;
  dy -= touchVec.y;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  const input = { dx, dy };
  if (interactPressed) input.interact = true;
  if (attackPressed) input.attack = true;
  interactPressed = false;
  attackPressed = false;
  return input;
}

// --- save ---
function saveGame(note) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      player: state.player,
      quests: state.quests.map((q) => ({ id: q.id, done: q.done, progress: q.progress })),
      shards: state.shards.map((s) => ({ id: s.id, collected: s.collected })),
      crops: state.crops.map((c) => ({ id: c.id, collected: c.collected })),
      herbs: state.herbs.map((h) => ({ id: h.id, consumed: h.consumed })),
      tick: state.tick, savedAt: Date.now(),
    }));
    setSaveText(panel.slots["save-state"], note || "저장됨", "저장됨");
  } catch { /* storage unavailable: game still runs */ }
}
setInterval(() => saveGame("자동 저장됨"), 5000);
addEventListener("beforeunload", () => saveGame("저장됨"));

// --- HUD + bark ---
const questsEl = panel.slots["quests"];
const npcEl = panel.slots["npc-state"];
const posEl = panel.slots["pos"];
const hpEl = panel.slots["hp"];
const hpFill = document.getElementById("hpfill");
const zoneEl = panel.slots["zone"];
let prevHitTick = null;
let prevHerbsConsumed = state.herbs.filter((h) => h.consumed).length;
const prevNpcState = new Map(state.npcs.map((n) => [n.id, n.state]));
function refreshHud() {
  renderQuests(questsEl, state.quests, (q) => q.progress ? ` (${q.progress})` : "");
  npcEl.textContent = state.npcs.map((n) => `${n.name}: ${STATE_LABEL[n.state] || n.state}`).join(" · ");
  setPosText(posEl, state.player.x, state.player.y);
  hpEl.textContent = `체력: ${state.player.hp}`;
  hpFill.style.width = `${Math.max(0, state.player.hp)}%`;
  zoneEl.textContent = `구역: ${state.player.y <= -2 && state.player.x <= 6 ? "농장" : state.player.x >= 16 ? "숲 깊은 곳" : state.player.x >= 10 ? "숲 입구" : "마을"}`;
  const talkQuests = state.quests.filter((q) => q.type === "quest.talk" && !q.done);
  let nearTalk = false;
  for (const q of talkQuests) {
    const npcId = (world.quests.find((wq) => wq.id === q.id)?.nodes || []).find((n) => n.id === "talk")?.params?.npcId;
    const npc = state.npcs.find((n) => n.id === npcId);
    if (npc && Math.hypot(state.player.x - npc.x, state.player.y - npc.y) < 1.5) { nearTalk = true; break; }
  }
  prompt.setVisible(nearTalk);
}

// --- main loop: fixed-step accumulator, render from sim state ---
let last = performance.now();
let acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  acc += dt;
  const input = readInput();
  let stepped = false;
  while (acc >= STEP) {
    const before = new Map(state.npcs.map((n) => [n.id, n.state]));
    const wasDone = new Map(state.quests.map((q) => [q.id, q.done]));
    const hpBefore = state.player.hp;
    state = step(state, input, barkRng, world);
    stepped = true;
    acc -= STEP;
    for (const n of state.npcs) {
      if (n.state !== before.get(n.id)) {
        const pool = n.id === "guardian-1" ? BARKS.guardian : n.interaction === "hostile" ? BARKS.boar : BARKS[n.state];
        bark.show(barkRng.pick(pool));
      }
    }
    if (state.lastHit && (!prevHitTick || state.lastHit.tick !== prevHitTick)) {
      prevHitTick = state.lastHit.tick;
      audio.play("hit");
      bark.show(barkRng.pick(BARKS.hit));
    }
    for (const q of state.quests) {
      if (q.done && !wasDone.get(q.id)) { audio.play("quest"); bark.show(barkRng.pick(BARKS.quest)); saveGame("의뢰 완료, 저장됨"); }
    }
    const herbsNow = state.herbs.filter((h) => h.consumed).length;
    if (herbsNow > prevHerbsConsumed) {
      prevHerbsConsumed = herbsNow;
      audio.play("heal");
      bark.show("약초를 먹었어. 체력이 회복됐어!");
    }
    if (state.player.hp < hpBefore) { audio.play("hurt"); bark.show("아야! 멧돼지에게 받혔어!"); }
  }
  if (stepped) refreshHud();
  bark.tick(dt);

  playerMesh.position.set(state.player.x, 0, state.player.y);
  for (const n of state.npcs) {
    const mesh = npcMeshes.get(n.id);
    if (!mesh) continue;
    mesh.visible = n.state !== "defeated";
    if (mesh.visible) mesh.position.set(n.x, 0, n.y);
  }
  for (const s of state.shards) {
    const mesh = shardMeshes.get(s.id);
    if (!mesh) continue;
    mesh.visible = !s.collected;
    if (mesh.visible) mesh.rotation.y += dt * 2;
  }
  for (const c of state.crops) {
    const mesh = cropMeshes.get(c.id);
    if (mesh) mesh.visible = !c.collected;
  }
  for (const h of state.herbs) {
    const mesh = herbMeshes.get(h.id);
    if (!mesh) continue;
    mesh.visible = !h.consumed;
    if (mesh.visible) mesh.rotation.y += dt * 2;
  }
  camera.position.set(state.player.x, 9, state.player.y + 9);
  camera.lookAt(state.player.x, 0, state.player.y);
  renderer.render(scene, camera);
}
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
refreshHud();
requestAnimationFrame(frame);

// QA hook: window.__SUPULI_M1__ = { state, hash, world, simulate, saveKey }
window.__SUPULI_M1__ = {
  get state() { return state; },
  get hash() { return stateHash(state); },
  world, simulate, saveKey: SAVE_KEY,
  audio: { get muted() { return audio.muted; }, get played() { return audio.played; } },
};
</script>
</body>
</html>
