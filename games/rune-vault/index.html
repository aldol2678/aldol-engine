<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>룬 금고 M4 — 상자·발판·열쇠 퍼즐 | Aldol Engine</title>
<meta property="og:title" content="룬 금고 M4 — 상자·발판·열쇠 퍼즐 | Aldol Engine">
<meta property="og:description" content="Aldol Engine 차세대 코어 후보 위의 탑다운 퍼즐 탐험. 상자를 밀어 발판을 누르고, 레버와 열쇠로 금고 방 3개를 통과한다.">
<meta property="og:type" content="website">
<style>
/* Page-local layout only (the shared HUD kit CSS is not changed). */
.hud-panel { box-sizing: border-box; }
#phase { text-align: right; }
#help { display: none; }
@media (min-width: 900px) and (min-height: 600px) { #help { display: block; } }
/* Short landscape phones: keep the panels narrow so the board stays visible. */
@media (max-height: 500px) { .hud-panel { max-width: 190px; } .hud-panel h1 { font-size: 13px; } }
</style>
</head>
<body>
<div id="app"></div>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.187.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { game, loadWorld, view, SEED, SAVE_KEY } from "./vault.js";
import { isBlocked } from "../../src/core/next/spatial.js";
import { count } from "../../src/core/next/inventory.js";
import { createBoard, easeTo } from "../../src/render/next/board.js";
import { createSaveSlot, createRunner, startLoop, bindKeys, ARROW_DIRS, createDpad, installProbe } from "../../src/render/next/shell.js";
import { createAudioManager } from "../../src/render/audio.js";
import { installHudCss, createHudPanel, createHelp, createRoundButton, bindMute, renderQuests, setSaveText } from "../../src/render/hud.js";

// World: the manifest is the only source of rooms and rules. A manifest
// that fails validation stops the game here, before anything renders.
const manifest = await (await fetch("./world.json")).json();
const world = loadWorld(manifest);

// Audio: procedural WebAudio voices (no audio files). BGM starts on the first gesture.
const audio = createAudioManager();
let muted = false;
try { muted = localStorage.getItem("aldol-engine.audio.muted") === "1"; } catch { muted = false; }
audio.setMuted(muted);
window.addEventListener("pointerdown", () => audio.startBgm(), { once: true });
window.addEventListener("keydown", () => audio.startBgm(), { once: true });

// --- HUD (shared kit, forest theme) ---
installHudCss("forest");
const panel = createHudPanel({
  id: "hud",
  title: "룬 금고 M4",
  rows: [
    { id: "zone", tag: "div" },
    { id: "moves", tag: "div" },
    { id: "keys", tag: "div" },
    { id: "quests", tag: "div", collapsible: true },
    { id: "save-state", tag: "div", collapsible: true },
  ],
});
const phasePanel = createHudPanel({ id: "phase", position: "right", style: { color: "#ffe9a8", padding: "8px 12px" }, rows: [{ id: "phase-text", tag: "div" }] });
createHelp("방향키/WASD: 이동·밀기 · R: 방 다시 · N: 새 게임 · M: 음소거", "center");
const short = () => window.innerHeight < 500;
// On a short landscape phone the panel is wide enough to start expanded, but
// tall enough to cover the board — start it collapsed there too.
if (short() && !panel.el.classList.contains("collapsed")) panel.el.querySelector(".hud-toggle")?.click();

// --- Sim session: start or restore, one command per tick ---
const SAVE_ON = { step: "", key: "열쇠 획득, 저장됨", unlock: "봉인 해제, 저장됨", cleared: "방 클리어, 저장됨", won: "승리, 저장됨", failed: "실패, 저장됨", reset: "방 다시, 저장됨", room: "다음 방, 저장됨" };
const VOICE = { push: "hit", key: "bite", lever: "talk", unlock: "catch", cleared: "quest", won: "quest", failed: "hurt", quest: "heal", room: "cast", reset: "cast" };
let hudDirty = true;
const saveSlot = createSaveSlot({ key: SAVE_KEY, game, world });
const runner = createRunner({
  game, world, seed: SEED, saveSlot,
  onStep(state, events) {
    if (events.length > 0) hudDirty = true;
    for (const ev of events) {
      if (ev.type === "door") audio.play("cast");
      else if (VOICE[ev.type]) audio.play(VOICE[ev.type]);
    }
  },
  shouldSave(state, events) {
    let note = null;
    for (const ev of events) if (ev.type in SAVE_ON) note = SAVE_ON[ev.type] || note || "저장됨";
    return note;
  },
});
const load = runner.loadResult;
let saveNote = load.ok ? "불러옴" : load.code === "E_NONE" ? "새 게임" : `저장 손상(${load.code}) — 새로 시작`;

// --- Board (shared Three.js board; primitives only) ---
function computeInsets() {
  if (window.innerWidth < window.innerHeight) return { top: 0.28, bottom: 0.42 };
  if (short()) return { top: 0.03, bottom: 0.03 };
  return { top: 0.12, bottom: 0.14 };
}
const insets = computeInsets();
const board = createBoard({ container: document.getElementById("app"), cols: world.board.cols, rows: world.board.rows, theme: "forest", insets });
window.addEventListener("resize", () => { Object.assign(insets, computeInsets()); board.fit(); });

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...extra });
const GEO = {
  wall: new THREE.BoxGeometry(1, 0.9, 1),
  crate: new THREE.BoxGeometry(0.74, 0.74, 0.74),
  door: new THREE.BoxGeometry(0.94, 1.0, 0.36),
  plate: new THREE.CylinderGeometry(0.36, 0.4, 0.08, 20),
  body: new THREE.CylinderGeometry(0.22, 0.28, 0.5, 14),
  head: new THREE.SphereGeometry(0.2, 14, 12),
  nose: new THREE.ConeGeometry(0.08, 0.2, 8),
  goal: new THREE.OctahedronGeometry(0.28),
  ring: new THREE.TorusGeometry(0.36, 0.05, 8, 24),
  keyRing: new THREE.TorusGeometry(0.13, 0.04, 8, 16),
  keyStem: new THREE.BoxGeometry(0.06, 0.3, 0.06),
  leverBase: new THREE.BoxGeometry(0.5, 0.12, 0.3),
  leverStick: new THREE.CylinderGeometry(0.04, 0.04, 0.5, 8),
  leverKnob: new THREE.SphereGeometry(0.09, 10, 8),
};
const MAT = {
  wall: mat(0x55624f, { roughness: 0.95 }), crate: mat(0xb07a3c), crateEdge: mat(0x7a5226),
  door: mat(0x7d8a96, { metalness: 0.3 }), seal: mat(0xd4a017, { metalness: 0.5, roughness: 0.4 }),
  plateUp: mat(0xc0563a), plateDown: mat(0x6fd08c, { emissive: 0x1d5c30 }),
  body: mat(0x3d7dd8), head: mat(0xf2d2b0), nose: mat(0xffe082),
  goal: mat(0xffd700, { metalness: 0.6, roughness: 0.3, emissive: 0x554400 }),
  key: mat(0xffd54a, { metalness: 0.6, roughness: 0.3 }), lever: mat(0x8d99a6), knobOff: mat(0xd84a4a), knobOn: mat(0x58d68d),
};
const FACING = { up: Math.PI, right: Math.PI / 2, down: 0, left: -Math.PI / 2 };
const shadow = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };

function makeMesh(item) {
  const g = new THREE.Group();
  const p = board.cellToWorld(item.c, item.r);
  g.position.set(p.x, 0, p.z);
  if (item.kind === "wall") {
    const m = shadow(new THREE.Mesh(GEO.wall, MAT.wall));
    m.position.y = 0.45;
    g.add(m);
  } else if (item.kind === "crate") {
    const m = shadow(new THREE.Mesh(GEO.crate, MAT.crate));
    m.position.y = 0.37;
    const band = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.12, 0.78), MAT.crateEdge);
    band.position.y = 0.37;
    g.add(m, band);
  } else if (item.kind === "door") {
    const m = shadow(new THREE.Mesh(GEO.door, item.key === "seal" || item.locked ? MAT.seal : MAT.door));
    m.position.y = 0.5;
    g.add(m);
    g.userData.slab = m;
    g.userData.wasSeal = item.locked;
  } else if (item.kind === "plate") {
    const m = new THREE.Mesh(GEO.plate, MAT.plateUp);
    m.position.y = 0.05;
    m.receiveShadow = true;
    g.add(m);
    g.userData.disc = m;
  } else if (item.kind === "lever") {
    const base = shadow(new THREE.Mesh(GEO.leverBase, MAT.lever));
    base.position.y = 0.06;
    const pivot = new THREE.Group();
    pivot.position.y = 0.1;
    const stick = new THREE.Mesh(GEO.leverStick, MAT.lever);
    stick.position.y = 0.25;
    const knob = new THREE.Mesh(GEO.leverKnob, MAT.knobOff);
    knob.position.y = 0.5;
    pivot.add(stick, knob);
    g.add(base, pivot);
    g.userData.pivot = pivot;
    g.userData.knob = knob;
  } else if (item.kind === "key") {
    const k = new THREE.Group();
    const ring = new THREE.Mesh(GEO.keyRing, MAT.key);
    ring.position.y = 0.2;
    const stem = new THREE.Mesh(GEO.keyStem, MAT.key);
    k.add(ring, stem);
    k.position.y = 0.5;
    g.add(k);
    g.userData.spin = k;
  } else if (item.kind === "goal") {
    const ring = new THREE.Mesh(GEO.ring, MAT.goal);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.06;
    const gem = new THREE.Mesh(GEO.goal, MAT.goal);
    gem.position.y = 0.6;
    g.add(ring, gem);
    g.userData.spin = gem;
  } else if (item.kind === "player") {
    const body = shadow(new THREE.Mesh(GEO.body, MAT.body));
    body.position.y = 0.3;
    const head = shadow(new THREE.Mesh(GEO.head, MAT.head));
    head.position.y = 0.72;
    const nose = new THREE.Mesh(GEO.nose, MAT.nose);
    nose.rotation.x = Math.PI / 2;
    nose.position.set(0, 0.7, 0.24);
    g.add(body, head, nose);
  }
  return g;
}
function updateMesh(g, item, dt) {
  const p = board.cellToWorld(item.c, item.r);
  if (item.kind === "player" || item.kind === "crate") easeTo(g, p.x, 0, p.z, dt, 18);
  if (item.kind === "player") g.rotation.y = FACING[item.facing] ?? 0;
  if (item.kind === "door") {
    const slab = g.userData.slab;
    slab.position.y += ((item.open ? -0.42 : 0.5) - slab.position.y) * Math.min(1, dt * 12 || 1);
    if (g.userData.wasSeal && !item.locked) { slab.material = MAT.door; g.userData.wasSeal = false; }
  }
  if (item.kind === "plate") {
    g.userData.disc.material = item.pressed ? MAT.plateDown : MAT.plateUp;
    g.userData.disc.position.y = item.pressed ? 0.02 : 0.05;
  }
  if (item.kind === "lever") {
    g.userData.pivot.rotation.z = item.on ? -0.6 : 0.6;
    g.userData.knob.material = item.on ? MAT.knobOn : MAT.knobOff;
  }
  if (g.userData.spin) g.userData.spin.rotation.y += dt * 1.6;
}
const objects = board.createMeshSync(makeMesh, updateMesh);
const walls = board.createMeshSync(makeMesh, () => {});
let wallLevel = -1;
function syncWalls(levelIndex) {
  if (levelIndex === wallLevel) return;
  wallLevel = levelIndex;
  const grid = world.levels[levelIndex].grid;
  const items = [];
  for (let r = 0; r < grid.rows; r++) {
    for (let c = 0; c < grid.cols; c++) if (isBlocked(grid, c, r)) items.push({ id: `w${levelIndex}-${c}-${r}`, kind: "wall", c, r });
  }
  walls.sync(items);
  objects.clear(); // new room: drop the old room's meshes at once (no easing across rooms)
}

// --- Input: keyboard, D-pad, buttons, cell taps -> runner.push(cmd) ---
const pushMove = (dir) => {
  const phase = runner.state.phase;
  if (phase === "cleared") runner.push({ next: true });
  else if (phase === "playing") runner.push({ move: dir });
};
const resetRoom = () => runner.push({ reset: true });
const newGame = () => { runner.restart(); saveNote = "새 게임"; hudDirty = true; audio.play("cast"); };
const keymap = { r: resetRoom, n: newGame, Enter: () => runner.push({ next: true }), " ": () => runner.push({ next: true }) };
for (const [key, dir] of Object.entries(ARROW_DIRS)) keymap[key] = () => pushMove(dir);
bindKeys(keymap);

const small = short();
const btnSize = small ? 44 : 48;
const btnBase = small ? 12 : 58;
createDpad({ onDir: pushMove, size: small ? 44 : 52, left: 14, bottom: btnBase, background: "rgba(30, 60, 40, 0.88)" });
const stackBtn = (i, spec) => createRoundButton({ size: btnSize, right: 14, bottom: btnBase + i * (btnSize + 8), fontSize: 13, ...spec });
stackBtn(0, { id: "reset-btn", label: "↺ 방", background: "rgba(150, 90, 30, 0.9)", onPress: resetRoom });
stackBtn(1, { id: "new-btn", label: "새 게임", background: "rgba(60, 90, 150, 0.9)", onPress: newGame }).style.fontSize = "11px";
const muteBtn = stackBtn(2, { id: "mute-btn", label: "🔊", background: "rgba(16, 26, 18, 0.85)" });
bindMute(audio, muteBtn);

// Tapping the board moves one step toward the tapped cell (dominant axis).
board.onCellTap((cell) => {
  const p = view(runner.state).find((o) => o.kind === "player");
  const dc = cell.c - p.c;
  const dr = cell.r - p.r;
  if (dc === 0 && dr === 0) return;
  pushMove(Math.abs(dc) >= Math.abs(dr) ? (dc > 0 ? "right" : "left") : (dr > 0 ? "down" : "up"));
});

// --- HUD refresh (only when a tick produced events or a note changed) ---
const PHASE_TEXT = {
  playing: () => "상자를 밀어 발판을 누르고 룬까지!",
  cleared: () => "방 클리어! 다음 방으로…",
  failed: () => "이동 횟수 소진 — ↺ 방 다시 (R)",
  won: () => "승리! 금고를 모두 통과했어요 ★ 새 게임(N)",
};
let lastNote = "";
function refreshHud() {
  const s = runner.state;
  const level = world.levels[s.level];
  panel.slots["zone"].textContent = `방 ${s.level + 1} / ${world.levels.length} · ${level.name}`;
  panel.slots["moves"].textContent = `남은 이동: ${s.movesLeft} / ${level.moveLimit}`;
  panel.slots["keys"].textContent = `열쇠: ${count(s.keys, "key")} · 룬: ${count(s.runes, "rune")}`;
  renderQuests(panel.slots["quests"], s.quests, (q) => (q.done ? "" : ` (${q.progress}/${q.target})`));
  setSaveText(panel.slots["save-state"], runner.saveNote && runner.saveNote !== lastNote ? (saveNote = runner.saveNote) : saveNote);
  lastNote = runner.saveNote;
  const text = phasePanel.slots["phase-text"];
  text.textContent = PHASE_TEXT[s.phase]();
  text.style.color = s.phase === "failed" ? "#ff9d9d" : s.phase === "won" ? "#8affc1" : "#ffe9a8";
}

installProbe({
  runner, game, board,
  extra: {
    saveKey: SAVE_KEY,
    view: () => view(runner.state),
    levels: world.levels.length,
    audio: { get muted() { return audio.muted; } },
  },
});

startLoop({
  runner,
  render(dt) {
    const s = runner.state;
    syncWalls(s.level);
    objects.sync(view(s), dt);
    if (hudDirty || runner.saveNote !== lastNote) { refreshHud(); hudDirty = false; }
    board.render();
  },
});
</script>
</body>
</html>
