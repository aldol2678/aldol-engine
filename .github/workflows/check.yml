name: check

# Aldol Engine checks on GitHub-hosted runners.
# The repo is public, so GitHub-hosted minutes are free.
# Previously ran on the temporary self-hosted runner `aldol-burn-vm2`
# (GCP, deleted 2026-11-26).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: node --version && npm --version
      - name: Run all checks
        run: npm run check:all

      - name: Run Next engine checks when present
        if: ${{ hashFiles('tools/check-next-all.mjs') != '' }}
        run: node tools/check-next-all.mjs
      - name: Stress RNG save restoration when present
        if: ${{ hashFiles('tools/next/rng-restore-stress.mjs') != '' }}
        run: node tools/next/rng-restore-stress.mjs
      - name: Verify actual MarginLife P3 combined source tree
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/ark-engine-next-04' && hashFiles('tools/next/verify-combined-marginlife.sh') != '' }}
        timeout-minutes: 10
        run: bash tools/next/verify-combined-marginlife.sh "$RUNNER_TEMP/engine-next-evidence/combined"
      # Bounded one-time integration evidence; no extra job or deploy.
      # Routine PRs retain only the existing and conditional headless checks.
      - name: Install cross-browser verification tooling
        id: browser_install
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.head_ref == 'feat/ark-engine-next-04' && hashFiles('tools/next/browser-check.mjs') != '' }}
        timeout-minutes: 10
        run: |
          cat /etc/os-release
          npm install --prefix "$RUNNER_TEMP/engine-next-browser" --no-save --package-lock=false --ignore-scripts playwright@1.56.1 three@0.187.0
          "$RUNNER_TEMP/engine-next-browser/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
      - name: Cross-browser gameplay evidence (desktop and new-game touch)
        if: ${{ !cancelled() && steps.browser_install.outcome == 'success' && github.event_name == 'pull_request' && github.head_ref == 'feat/ark-engine-next-04' && hashFiles('tools/next/browser-check.mjs') != '' }}
        timeout-minutes: 30
        env:
          NODE_PATH: ${{ runner.temp }}/engine-next-browser/node_modules
          THREE_BUILD_DIR: ${{ runner.temp }}/engine-next-browser/node_modules/three/build
        run: |
          set +e
          node tools/next/browser-check.mjs --configs desktop --out "$RUNNER_TEMP/engine-next-evidence/desktop" --no-shots
          desktop=$?
          # Existing mobile drag uses Chromium-only CDP; do not claim
          # Firefox/WebKit mobile coverage for the legacy three games.
          node tools/next/browser-check.mjs --games rune-vault,star-tactics,star-foundry --configs phone-portrait --out "$RUNNER_TEMP/engine-next-evidence/touch" --no-shots
          touch=$?
          set -e
          node --input-type=module -e '
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const dir = process.env.RUNNER_TEMP + "/engine-next-evidence";
          for (const [mode, games] of [["desktop",["supuli","star-fishing","star-defense","rune-vault","star-tactics","star-foundry"]],["touch",["rune-vault","star-tactics","star-foundry"]]]) {
            const data=JSON.parse(fs.readFileSync(dir+"/"+mode+"/logs/browser-check.json","utf8"));
            for (const engine of ["chromium","firefox","webkit"]) {
              assert.ok(data.engines.some(x=>x.name===engine && x.status==="RUN"),engine+" not run");
              for (const game of games) assert.equal(data.results.filter(x=>x.engine===engine && x.game===game && x.config===(mode==="desktop"?"desktop":"phone-portrait") && x.result==="PASS").length,1,engine+"/"+game+"/"+mode);
            }
            assert.equal(data.results.length,games.length*3);
          }'
          test "$desktop" -eq 0 && test "$touch" -eq 0
      - name: Preserve cross-browser evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'feat/ark-engine-next-04' }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-next-04-integration-evidence
          path: ${{ runner.temp }}/engine-next-evidence/
          if-no-files-found: warn
          retention-days: 7
